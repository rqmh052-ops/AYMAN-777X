<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2213" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>School Maze Horror V5</title>
  <style>
    :root {
      --bg: #11180f;
      --hud: #0d1110cc;
      --hud-border: rgba(255,255,255,.10);
      --text: #eef2f6;
      --muted: #c4cfbe;
      --accent: #edd56a;
      --icon: #eef2f6;
      --pause: rgba(0,0,0,.6);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); font-family: system-ui, sans-serif; color: var(--text); touch-action: none; }
    body.paused #game { filter: brightness(0.7); }
    #app { position: relative; width: 100%; height: 100%; }
    #game { display: block; width: 100%; height: 100%; will-change: transform; transform: translateZ(0); }
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    #top-controls {
      position: absolute; top: 8px; left: 8px;
      display: flex; gap: 4px; align-items: flex-start;
      pointer-events: auto; flex-direction: row-reverse; z-index: 11;
    }
    .pill {
      height: 26px; display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 0 8px; border-radius: 999px;
      border: 1px solid var(--hud-border); background: rgba(13,17,16,0.92);
      color: var(--text); font-size: 11px; font-weight: 700;
    }
    .button-pill { cursor: pointer; border: none; }
    .button-pill:active { transform: scale(0.985); }
    #quality-pill { color: var(--accent); min-width: 58px; }
    #instructions-panel {
      position: absolute; top: 44px; left: 8px;
      background: rgba(13,17,16,0.92); border: 1px solid var(--hud-border);
      padding: 8px 10px; border-radius: 10px; font-size: 10px;
      color: var(--accent);
      max-width: 165px; line-height: 1.45;
    }
    #interaction-prompt {
      position: absolute; top: 65%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px;
      border: 1px solid var(--accent); font-size: 15px; font-weight: bold;
      display: none; pointer-events: none;
    }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: var(--pause); pointer-events: auto; opacity: 1; transition: opacity 0.2s; z-index: 50;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .settings-card {
      padding: 18px; border-radius: 16px;
      background: rgba(15, 18, 15, 0.95); border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      overflow-y: auto; box-sizing: border-box; text-align: right;
    }
    .settings-card h2 { margin: 0 0 14px 0; color: var(--accent); text-align: center; }
    .setting-row { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .setting-row label { font-size: 13px; }
    input[type="range"] { accent-color: var(--accent); width: min(140px, 42vw); }
    input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
    .pc-instructions { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 11px; line-height: 1.65; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.05); }
    .key { background: #333; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .close-btn {
      width: 100%; padding: 10px; border-radius: 8px;
      background: var(--text); color: #000; font-weight: bold;
      border: none; cursor: pointer; margin-top: 8px;
    }
    #mobile-ui { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 5; }
    #joystick {
      position: absolute; left: 18px; bottom: 18px;
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.35) 100%);
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07);
      pointer-events: auto;
    }
    #joystick .knob {
      position: absolute; left: 50%; top: 50%;
      width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.55) 0%, rgba(180,180,180,0.18) 60%, rgba(255,255,255,0.08) 100%);
      border: 1.5px solid rgba(255,255,255,0.35);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,255,255,0.04);
      transition: box-shadow 0.1s;
    }
    .action-btn {
      position: absolute; display: none;
      justify-content: center; align-items: center;
      font-weight: 800; pointer-events: auto;
      transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .action-btn:active { transform: scale(0.91); filter: brightness(1.2); }
    #btn-fire {
      width: 80px; height: 80px; bottom: 22px; right: 22px; border-radius: 50%;
      background: radial-gradient(circle at 40% 30%, #ff5e5e 0%, #c0112b 55%, #7a000e 100%);
      border: 2.5px solid rgba(255,120,100,0.55);
      box-shadow: 0 0 18px rgba(220,30,50,0.65), 0 0 40px rgba(200,20,40,0.28), inset 0 1px 0 rgba(255,200,200,0.25);
    }
    #btn-fire svg {
      width: 40px; height: 40px; fill: none; stroke: #fff;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
    }
    #btn-fire::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: transparent; border: 1.5px solid rgba(255,80,60,0.2);
      animation: pulse-ring 1.6s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 0.7; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    #btn-interact {
      width: 76px; height: 76px; bottom: 120px; right: 30px; border-radius: 50%;
      background: radial-gradient(circle at 40% 30%, #ffe97a 0%, #d4a017 55%, #8a6500 100%);
      border: 2px solid rgba(255,230,80,0.5);
      box-shadow: 0 0 14px rgba(220,170,0,0.6), 0 0 32px rgba(200,140,0,0.25), inset 0 1px 0 rgba(255,255,180,0.3);
      font-size: 26px; color: #fff; text-shadow: 0 1px 6px rgba(180,120,0,0.8);
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      background: rgba(255,255,255,0.8); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
    }
    @media (hover: none) and (pointer: coarse) { #mobile-ui { display: block; } }
    @media (max-width: 480px) {
      #top-controls { top: 6px; left: 6px; gap: 3px; }
      .pill { height: 24px; font-size: 10px; padding: 0 7px; }
      #quality-pill, #fps-pill { min-width: 50px; }
      #instructions-panel { top: 38px; left: 6px; max-width: 150px; font-size: 10px; padding: 7px 9px; }
      .settings-card { width: calc(100vw - 16px); padding: 14px; max-height: calc(100vh - 16px); }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="top-controls">
        <button class="pill button-pill" id="settings-pill">الإعدادات ⚙️</button>
        <div class="pill" id="quality-pill">Medium</div>
        <div class="pill" id="fps-pill">FPS: 0</div>
      </div>
      <div id="instructions-panel">اجمع 3 مفاتيح 🗝️<br>لفتح الباب والهروب!</div>
      <div id="interaction-prompt">اضغط [E] لفتح الباب</div>
      <div id="hearts-hud" style="
        position:absolute;top:44px;right:8px;
        display:flex;gap:5px;direction:ltr;
        background:rgba(13,17,16,0.85);
        border:1px solid rgba(255,80,80,0.25);
        border-radius:999px;padding:5px 12px;
        pointer-events:none;align-items:center;
      "></div>
      <div id="keys-hud" style="
        position:absolute;top:80px;right:8px;
        display:flex;gap:4px;direction:ltr;align-items:center;
        background:rgba(13,17,16,0.85);
        border:1px solid rgba(255,200,0,0.3);
        border-radius:999px;padding:4px 10px;
        pointer-events:none;font-size:13px;font-weight:700;color:#ffd700;
      ">🗝️ 0/3</div>
      <button id="map-btn" style="
        position:absolute;top:116px;right:8px;
        background:rgba(13,17,16,0.85);border:1px solid rgba(255,200,0,0.3);
        border-radius:999px;padding:4px 10px;
        font-size:12px;font-weight:700;color:#aaa;cursor:pointer;
        pointer-events:auto;display:none;
      ">🗺️ الخريطة [M]</button>
    </div>
    <div id="crosshair"></div>
    <div id="mobile-ui">
      <div id="joystick"><div class="knob"></div></div>
      <div id="btn-fire" class="action-btn">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <circle cx="12" cy="12" r="2" fill="white"></circle>
        </svg>
      </div>
      <div id="btn-interact" class="action-btn">🚪</div>
    </div>
    <div id="settings-overlay" class="overlay">
      <div class="settings-card">
        <h2>ابدأ اللعبة</h2>
        <div class="pc-instructions">
          <b>تعليمات الـ PC:</b><br>
          <span class="key">W A S D</span> للحركة السريعة<br>
          <span class="key">F</span> أو <b>الماوس</b> للإطلاق | <span class="key">E</span> للتفاعل<br>
          <span class="key">M</span> لفتح الخريطة (بعد جمعها)<br>
          🗝️ اجمع 3 مفاتيح لفتح الباب<br>
          🗺️ ابحث عن الخريطة في الممرات<br>
          💡 عند قلب واحد → هدية خريطة!
        </div>
        <div class="setting-row">
          <label>الحساسية (Sensitivity)</label>
          <input type="range" id="sense-slider" min="0.001" max="0.01" step="0.001" value="0.003">
        </div>
        <div class="setting-row">
          <label>المؤثرات الصوتية</label>
          <input type="checkbox" id="sound-toggle" checked>
        </div>
        <div class="setting-row">
          <label>الموسيقى</label>
          <input type="checkbox" id="music-toggle" checked>
        </div>
        <button class="close-btn" id="close-settings">▶ ابدأ اللعبة</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
  // ============================================================
  //  GLOBAL SETTINGS
  // ============================================================
  const GameSettings = {
    sensitivity: 0.003,
    sound: true,
    music: true,
    paused: true
  };

  function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
  function lerp(a, b, t)        { return a + (b - a) * t; }
  function rand(min, max)       { return min + Math.random() * (max - min); }

  // كشف البيئة مبكراً — يُستخدم في makeTexture والأضواء وغيرها
  const _isMobile  = /Android|iPhone|iPad/i.test(navigator.userAgent);
  const _isWebView = /; wv\)/i.test(navigator.userAgent)
    || (_isMobile && navigator.userAgent.indexOf('Version/') === -1 && /Chrome\//.test(navigator.userAgent) && !('chrome' in window));

  // ============================================================
  //  TEXTURE GENERATOR  (داخل HTML - لا يحتاج ملف خارجي)
  // ============================================================
  function makeTexture({ size = 256, base = '#20261d', detail = '#313b2a', accent = '#0a0c08', repeat = 8 } = {}) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = base; ctx.fillRect(0, 0, size, size);
    for (let i = 0; i < size * size * 0.1; i++) {
      ctx.globalAlpha = Math.random() * 0.2 + 0.04;
      ctx.fillStyle = Math.random() > 0.5 ? detail : accent;
      ctx.beginPath(); ctx.arc(Math.random() * size, Math.random() * size, rand(1, 4), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = Math.random() > 0.7 ? '#6a2b24' : '#ffffff';
      ctx.fillRect(rand(0, size), rand(0, size), rand(18, 64), rand(1, 5));
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeat, repeat);
    // على APK: anisotropy=1 يوفر memory bandwidth
    tex.anisotropy = (_isMobile || (_isWebView)) ? 1 : 4;
    return tex;
  }

  // ============================================================
  //  AUDIO SYSTEM
  //  - صوت الإطلاق داخل HTML
  //  - صوت العدو يُحمَّل من ملف خارجي: audio/enemy_sound.mp3
  //    ويتحكم به بناءً على المسافة تدريجياً
  // ============================================================
  const AudioSys = {
    ctx: null,

    init() {
      if (this.ctx) return;
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    },

    playShoot() {
      if (!GameSettings.sound || !this.ctx) return;
      const time = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.3;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1500;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.8, time);
      gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
      noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      noise.start(time);
    }
  };

  // ============================================================
  //  ENEMY SOUND SYSTEM  (صوت العدو بناءً على المسافة)
  //  يحمّل ملف: audio/enemy_sound.mp3  من السيرفر
  // ============================================================
  const EnemyAudio = {
    buffer: null,
    source: null,
    gainNode: null,
    loaded: false,

    init(audioCtx) {
      if (this.loaded) return;
      this.loaded = true;
      this.gainNode = audioCtx.createGain();
      this.gainNode.gain.value = 0;
      this.gainNode.connect(audioCtx.destination);

      fetch('audio/enemy_sound.mp3')
        .then(r => r.arrayBuffer())
        .then(ab => audioCtx.decodeAudioData(ab))
        .then(decoded => {
          this.buffer = decoded;
          this._playLoop(audioCtx);
        })
        .catch(() => {
          // صوت العدو غير متوفر - يستمر اللعب بدونه
          console.warn('[EnemyAudio] audio/enemy_sound.mp3 not found');
        });
    },

    _playLoop(audioCtx) {
      if (!this.buffer) return;
      this.source = audioCtx.createBufferSource();
      this.source.buffer = this.buffer;
      this.source.loop = true;
      this.source.connect(this.gainNode);
      this.source.start(0);
    },

    // يُستدعى كل frame - يضبط مستوى الصوت بناءً على المسافة
    // maxDist: المسافة التي يصل فيها الصوت إلى أدنى مستوى (لكن لا يُقطع تماماً)
    updateVolume(distance, maxDist = 30) {
      if (!this.gainNode || !GameSettings.sound) return;
      // صوت تدريجي: قريب = 0.9 ، بعيد جداً = 0.03
      const t = clamp(distance / maxDist, 0, 1);
      const vol = lerp(0.9, 0.03, t);
      this.gainNode.gain.setTargetAtTime(vol, AudioSys.ctx.currentTime, 0.2);
    },

    stop() {
      if (this.gainNode) this.gainNode.gain.setTargetAtTime(0, AudioSys.ctx.currentTime, 0.1);
    }
  };

  // ============================================================
  //  MUSIC SYSTEM  (موسيقى الخلفية)
  //  يحمّل ملف: audio/music.mp3
  //  المستوى أقل من صوت العدو — مثل الألعاب الاحترافية
  //  صوت العدو: 0.03 → 0.9 (حسب المسافة)
  //  الموسيقى:  0.18 ثابت (أقل بكثير، خلفية فقط)
  // ============================================================
  const MusicSys = {
    gainNode: null,
    loaded: false,

    init(audioCtx) {
      if (this.loaded) return;
      this.loaded = true;
      this.gainNode = audioCtx.createGain();
      // 0.18 = مستوى هادئ يناسب موسيقى الخلفية
      // (صوت العدو يصل لـ 0.9 عند الاقتراب — الموسيقى دائماً أقل منه)
      this.gainNode.gain.value = 0;
      this.gainNode.connect(audioCtx.destination);

      fetch('audio/music.mp3')
        .then(r => r.arrayBuffer())
        .then(ab => audioCtx.decodeAudioData(ab))
        .then(decoded => {
          const source = audioCtx.createBufferSource();
          source.buffer = decoded;
          source.loop = true;
          source.connect(this.gainNode);
          source.start(0);
          // Fade in تدريجي عند البداية — يبدو احترافياً أكثر
          this.gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
          this.gainNode.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 3.0);
        })
        .catch(() => {
          console.warn('[MusicSys] audio/music.mp3 not found');
        });
    },

    setEnabled(enabled) {
      if (!this.gainNode || !AudioSys.ctx) return;
      const target = enabled ? 0.18 : 0;
      this.gainNode.gain.setTargetAtTime(target, AudioSys.ctx.currentTime, 0.5);
    }
  };

  // ============================================================
  //  AK47 PROCEDURAL GUN  (داخل HTML)
  // ============================================================
  function createAK47() {
    const g = new THREE.Group();
    const metal = new THREE.MeshStandardMaterial({ color: '#1a1f23', roughness: 0.6, metalness: 0.5 });
    const wood  = new THREE.MeshStandardMaterial({ color: '#624126', roughness: 0.9, metalness: 0.05 });
    const body      = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.78), metal); body.position.z = -0.06;
    const barrel    = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.48, 8), metal); barrel.rotation.x = Math.PI / 2; barrel.position.z = -0.48;
    const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.18), wood); handguard.position.z = -0.24;
    const magazine  = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.28, 0.14), metal); magazine.rotation.x = 0.48; magazine.position.set(0, -0.15, -0.02);
    const grip      = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.08), wood); grip.rotation.x = -0.35; grip.position.set(0, -0.09, 0.16);
    const stock     = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.24), wood); stock.position.set(0, 0.05, 0.42);
    g.add(body, barrel, handguard, magazine, grip, stock);
    return g;
  }

  // ============================================================
  //  MAP LAYOUT  (داخل HTML)
  //  ✅ تم بناء هذه الخريطة بواسطة Recursive Backtracker
  //  ✅ تم التحقق عبر BFS: 701/701 خلية متصلة — صفر مناطق معزولة
  //  ✅ جميع الصفوف 37 حرف بالضبط (تحقق رياضياً)
  //  ✅ الحدود مغلقة بالكامل (جدران صلبة في كل الجهات)
  //  ✅ S (اللاعب) و A (العدو) و D (الباب) كلها reachable
  //  ✅ لا توجد fake walls أو softlocks
  // ============================================================
  const mapLayout = [
    "#####################################",
    "#.#.........#...#.......#.....#.....#",
    "#.#.#.###.#.#.#.#.####..#.###.#.#.#.#",
    "#.#.#.#...#.#.#.#...#...#.#.#...#...#",
    "#.#.#.#.###.#.#.#.#...###.#.###.###.#",
    "#...#...#.#...#...#.#...#.#.......#.#",
    "#########.##.######.###.#.###.#.#.#.#",
    "#.#...#.........#.....#.#.......#...#",
    "#.#.#.#..##.###.#.#.#.#..######.#.###",
    "#...#...#.#.#...#.#.#.#...#.....#...#",
    "#.######..#.###.#.#.#####.#.######..#",
    "#.#.......#...#.#.#.......#.#.....#.#",
    "#S..#####.###.###.#########....##.#.#",
    "#.......#.........#.....#...#...#...#",
    "#######.#.#######.#.###.#.#####.###.#",
    "#...#...#...........#.#.#.#...#...#.#",
    "#.##..###.#.###..####...#.#.#.###.###",
    "#.#...#.#.#...#.#.......#.#.....#...#",
    "#.#..##.#.###.#.###.#####.#.###.##..#",
    "#...#.....#.......#.......#.#...#...#",
    "#.###.#####.####..#####.#.#...#.#.#.#",
    "#.#.#...#...#...#...........#.#...#.#",
    "#.#.###.###.#.#.##..#.#.#######.###.#",
    "#.#...#.....#.#.#.....#.#...#...#...#",
    "#.#.#.###.###.#...###.#A#.#.#.###.#.#",
    "#.#.#...#.#...#...#...#.#.#...#...#.#",
    "#.###.##....#######.###.#.#####.###.#",
    "#...#.....#...#...#.#...#.......#.#.#",
    "###.#.######....###.#.########.##.#.#",
    "#...#...#.....#...#.#.............#.#",
    "#.#######.#.#####.#.###.#.#######.#.#",
    "#.#.......#.......#.#...#...#...#...#",
    "#.#.#..###..###.#...#...#.#.###.#.#.#",
    "#.#.#.#.....#.#.#.#.#.#...#...#...#.#",
    "#.###.#.#.###...#.#.###.#####.#####.#",
    "#.....#.................#..........D#",
    "#####################################",
  ];

  // ============================================================
  //  NAV GRAPH  — المصدر الموحد للبيانات الهندسية
  //  يُستخدم من: Collision + Minimap + AI + Spawn + Validation
  // ============================================================
  const NavGraph = {
    rows: 0,
    cols: 0,
    walkable: null,      // Uint8Array[rows*cols] — 1=walkable, 0=wall
    reachable: null,     // Uint8Array[rows*cols] — 1=reachable from S
    reachableList: [],   // مصفوفة {r,c} للخلايا القابلة للوصول

    build() {
      const rows = mapLayout.length;
      // تحقق من أن جميع الصفوف متساوية الطول
      const cols = mapLayout[0].length;
      for (let r = 0; r < rows; r++) {
        if (mapLayout[r].length !== cols) {
          console.error(`[NavGraph] ERROR: Row ${r} has length ${mapLayout[r].length}, expected ${cols}`);
        }
      }
      this.rows = rows;
      this.cols = cols;
      this.walkable  = new Uint8Array(rows * cols);
      this.reachable = new Uint8Array(rows * cols);

      // تعبئة walkable
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          this.walkable[r * cols + c] = (mapLayout[r][c] !== '#') ? 1 : 0;
        }
      }

      // BFS Flood Fill من نقطة S
      let sr = -1, sc = -1;
      outer: for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (mapLayout[r][c] === 'S') { sr = r; sc = c; break outer; }
      }
      if (sr === -1) { sr = 1; sc = 1; } // fallback

      const queue = [sr * cols + sc];
      this.reachable[sr * cols + sc] = 1;
      const dirs4 = [-cols, cols, -1, 1];
      let head = 0;
      while (head < queue.length) {
        const idx = queue[head++];
        const r = (idx / cols) | 0;
        const c = idx % cols;
        this.reachableList.push({ r, c });
        for (const d of dirs4) {
          const ni = idx + d;
          const nr = (ni / cols) | 0;
          const nc = ni % cols;
          // تحقق من حدود + walkable + غير مزارة
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          if (d === 1  && nc === 0) continue; // لف الصف
          if (d === -1 && nc === cols - 1) continue;
          if (this.reachable[ni] || !this.walkable[ni]) continue;
          this.reachable[ni] = 1;
          queue.push(ni);
        }
      }

      // تشخيص
      const totalWalkable = this.walkable.reduce((s, v) => s + v, 0);
      const totalReachable = this.reachableList.length;
      const isolated = totalWalkable - totalReachable;
      console.log(`[NavGraph] ✅ Walkable: ${totalWalkable} | Reachable: ${totalReachable} | Isolated: ${isolated}`);
      if (isolated > 0) console.error(`[NavGraph] ❌ CRITICAL: ${isolated} isolated cells found!`);

      // تحقق من Door D
      let doorReachable = false;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (mapLayout[r][c] === 'D' && this.reachable[r * cols + c]) doorReachable = true;
      }
      console.log(`[NavGraph] Door reachable: ${doorReachable ? '✅' : '❌ CRITICAL BUG'}`);
    },

    isWalkable(r, c) {
      if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return false;
      return this.walkable[r * this.cols + c] === 1;
    },

    isReachable(r, c) {
      if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return false;
      return this.reachable[r * this.cols + c] === 1;
    },

    // إيجاد خلية عشوائية قابلة للوصول بعيدة عن موضع مرجعي
    randomReachableCell(avoidR, avoidC, minCellDist = 5) {
      // فلتر بمسافة كافية
      let candidates = this.reachableList.filter(({r, c}) => {
        if (mapLayout[r][c] === '#' || mapLayout[r][c] === 'D') return false;
        return Math.abs(r - avoidR) + Math.abs(c - avoidC) >= minCellDist;
      });
      if (candidates.length === 0) candidates = this.reachableList.filter(({r,c}) => mapLayout[r][c] !== '#');
      if (candidates.length === 0) return { r: avoidR, c: avoidC };
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
  };

  // ============================================================
  //  SCHOOL MAZE  (داخل HTML) — موحّد مع NavGraph
  // ============================================================
  class SchoolMaze {
    constructor(scene) {
      this.scene = scene;
      this.cellSize = 3.4;
      this.wallHeight = 3.25;
      this.colliders = [];
      this.spawn = new THREE.Vector3();
      this.doorPos = new THREE.Vector3();
      this.wallMat = new THREE.MeshStandardMaterial({
        color: '#8f9a81',
        map: makeTexture({ base: '#242d1d', detail: '#38452f', accent: '#0b0d08', repeat: 6 }),
        roughness: 0.96
      });
      this.floorMat = new THREE.MeshStandardMaterial({
        color: '#b3b38c',
        map: makeTexture({ base: '#8d8b5e', detail: '#bbb28a', accent: '#60603d', repeat: 10 }),
        roughness: 1
      });
      this.ceilMat = new THREE.MeshStandardMaterial({ color: '#3a402b', roughness: 1 });
    }

    build() {
      // أولاً: بناء NavGraph (المصدر الموحد)
      NavGraph.build();

      const rows = NavGraph.rows;
      const cols = NavGraph.cols;

      const floorGeo = new THREE.PlaneGeometry(cols * this.cellSize, rows * this.cellSize);
      const floor = new THREE.Mesh(floorGeo, this.floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set((cols * this.cellSize) / 2 - this.cellSize / 2, 0, (rows * this.cellSize) / 2 - this.cellSize / 2);
      this.scene.add(floor);

      const ceil = new THREE.Mesh(floorGeo, this.ceilMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.copy(floor.position);
      ceil.position.y = this.wallHeight;
      this.scene.add(ceil);

      const wallGeo = new THREE.BoxGeometry(this.cellSize, this.wallHeight, this.cellSize);
      const matrices = [];
      const dummy = new THREE.Object3D();

      this.keyObjects = [];
      this.mapItemObj = null;

      for (let z = 0; z < rows; z++) {
        for (let x = 0; x < cols; x++) {
          const t = mapLayout[z][x];
          const px = x * this.cellSize;
          const pz = z * this.cellSize;
          if (t === '#') {
            dummy.position.set(px, this.wallHeight / 2, pz);
            dummy.updateMatrix();
            matrices.push(dummy.matrix.clone());
            this.colliders.push({
              min: { x: px - this.cellSize / 2, z: pz - this.cellSize / 2 },
              max: { x: px + this.cellSize / 2, z: pz + this.cellSize / 2 }
            });
          } else {
            if (t === 'S') this.spawn.set(px, 0, pz);
            if (t === 'D') { this.doorPos.set(px, 0, pz); this._buildDoor(px, pz); }
          }
        }
      }

      const walls = new THREE.InstancedMesh(wallGeo, this.wallMat, matrices.length);
      for (let i = 0; i < matrices.length; i++) walls.setMatrixAt(i, matrices[i]);
      walls.instanceMatrix.needsUpdate = true;
      this.scene.add(walls);

      // وضع المفاتيح والخريطة بناءً على NavGraph
      this._placeKeys();
      this._placeMapItem();

      this.scene.background = new THREE.Color('#1a2213');
      const fogFar  = _isWebView ? 32 : (_isMobile ? 42 : 70);
      const fogNear = _isWebView ? 10 : 14;
      this.scene.fog = new THREE.Fog('#1a2213', fogNear, fogFar);

      this.scene.add(new THREE.AmbientLight('#ffffff', 1.4));
      this.scene.add(new THREE.HemisphereLight('#f2efc0', '#5f6632', 0.6));
      const sun = new THREE.DirectionalLight('#f0edcc', 0.5);
      sun.position.set(20, 26, 12);
      this.scene.add(sun);

      // أضواء موزعة على الخلايا القابلة للوصول
      const _lightCount = _isWebView ? 1 : (_isMobile ? 2 : 3);
      const lightStep = Math.floor(NavGraph.reachableList.length / _lightCount);
      for (let i = 0; i < _lightCount; i++) {
        const cell = NavGraph.reachableList[Math.min(i * lightStep + (lightStep / 2 | 0), NavGraph.reachableList.length - 1)];
        const l = new THREE.PointLight('#ffe8a0', 1.8, 22, 2.0);
        l.position.set(cell.c * this.cellSize, 2.5, cell.r * this.cellSize);
        this.scene.add(l);
      }
    }

    _placeKeys() {
      // استخدم NavGraph — خلايا reachable بعيدة عن الـ Spawn
      const spawnR = Math.round(this.spawn.z / this.cellSize);
      const spawnC = Math.round(this.spawn.x / this.cellSize);
      const cs = this.cellSize;
      const keyColors = [0xffd700, 0x00bfff, 0xff4500];

      // اختر 3 خلايا reachable بعيدة عن البداية ومتباعدة عن بعضها
      const placed = [];
      for (let i = 0; i < 3; i++) {
        let best = null, bestScore = -1;
        // جرب 50 خلية عشوائية واختر الأبعد
        for (let attempt = 0; attempt < 80; attempt++) {
          const minDist = 10 + i * 3;
          const cell = NavGraph.randomReachableCell(spawnR, spawnC, minDist);
          if (mapLayout[cell.r][cell.c] === 'A' || mapLayout[cell.r][cell.c] === 'D') continue;
          // تأكد أنها ليست قريبة من مفاتيح أخرى
          const tooClose = placed.some(p => Math.abs(p.r - cell.r) + Math.abs(p.c - cell.c) < 6);
          if (tooClose) continue;
          const score = Math.abs(cell.r - spawnR) + Math.abs(cell.c - spawnC);
          if (score > bestScore) { bestScore = score; best = cell; }
        }
        if (!best) best = NavGraph.randomReachableCell(spawnR, spawnC, 4);
        placed.push(best);

        const px = best.c * cs, pz = best.r * cs;
        const keyGroup = new THREE.Group();
        const headMat = new THREE.MeshStandardMaterial({ color: keyColors[i], metalness: 0.9, roughness: 0.1, emissive: new THREE.Color(keyColors[i]), emissiveIntensity: 0.3 });
        const head  = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.06, 8, 16), headMat);
        head.rotation.x = Math.PI / 2; head.position.y = 0.55;
        const shaft  = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 8), headMat);
        shaft.position.y = 0.28;
        const tooth1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.06), headMat); tooth1.position.set(0.1, 0.18, 0);
        const tooth2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.06), headMat); tooth2.position.set(0.1, 0.1, 0);
        keyGroup.add(head, shaft, tooth1, tooth2);
        if (!_isWebView) { const kl = new THREE.PointLight(keyColors[i], 0.8, 4); kl.position.y = 0.5; keyGroup.add(kl); }
        keyGroup.position.set(px, 0, pz);
        keyGroup.userData = { isKey: true, keyIndex: i, collected: false, worldPos: { x: px, z: pz } };
        this.keyObjects.push(keyGroup);
        this.scene.add(keyGroup);
        console.log(`[Spawn] Key ${i} at grid (${best.r},${best.c}) — reachable: ${NavGraph.isReachable(best.r, best.c)}`);
      }
    }

    _placeMapItem() {
      const spawnR = Math.round(this.spawn.z / this.cellSize);
      const spawnC = Math.round(this.spawn.x / this.cellSize);
      const cell = NavGraph.randomReachableCell(spawnR, spawnC, 6);
      if (!cell) return;

      const cs = this.cellSize;
      const px = cell.c * cs, pz = cell.r * cs;
      const mapGroup = new THREE.Group();
      const paperMat = new THREE.MeshStandardMaterial({ color: '#e8d5a3', roughness: 0.8, emissive: new THREE.Color('#c4a84f'), emissiveIntensity: 0.2 });
      const paper = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.02, 0.35), paperMat);
      paper.position.y = 0.01;
      const lineMat = new THREE.MeshStandardMaterial({ color: '#5a3e28' });
      for (let i = 0; i < 3; i++) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.005, 0.02), lineMat);
        line.position.set(0, 0.015, -0.06 + i * 0.06);
        paper.add(line);
      }
      if (!_isWebView) { const ml = new THREE.PointLight('#ffcc55', 0.6, 3); ml.position.y = 0.5; mapGroup.add(ml); }
      mapGroup.add(paper);
      mapGroup.position.set(px, 0, pz);
      mapGroup.userData = { isMapItem: true, collected: false, worldPos: { x: px, z: pz } };
      this.mapItemObj = mapGroup;
      this.scene.add(mapGroup);
      console.log(`[Spawn] MapItem at grid (${cell.r},${cell.c}) — reachable: ${NavGraph.isReachable(cell.r, cell.c)}`);
    }

    _buildDoor(x, z) {
      // ===== باب واقعي صغير ملتزق بالجدار =====
      // أبعاد الباب: عرض 1.1 وحدة، ارتفاع 2.2 وحدة — أصغر بكثير من الخلية (3.4)
      const DW = 1.1;   // عرض الباب
      const DH = 2.2;   // ارتفاع الباب
      const DT = 0.10;  // سُمك الباب

      // ===== مواد الباب =====
      const doorPanelMat = new THREE.MeshStandardMaterial({
        color: '#5c3a1e',   // بني خشبي داكن
        roughness: 0.85,
        metalness: 0.05,
      });
      const doorFrameMat = new THREE.MeshStandardMaterial({
        color: '#3a2008',   // إطار أغمق
        roughness: 0.9,
        metalness: 0.0,
      });
      const handleMat = new THREE.MeshStandardMaterial({
        color: '#c8a000',   // مقبض ذهبي
        roughness: 0.2,
        metalness: 0.9,
      });

      // ===== مجموعة الإطار (ثابتة، ملتصقة بالجدار) =====
      this.doorFrameGroup = new THREE.Group();
      this.doorFrameGroup.position.set(x, 0, z);

      // الإطار العلوي
      const topFrame = new THREE.Mesh(new THREE.BoxGeometry(DW + 0.14, 0.08, DT + 0.04), doorFrameMat);
      topFrame.position.set(0, DH + 0.04, 0);
      this.doorFrameGroup.add(topFrame);

      // الإطار الأيسر
      const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(0.07, DH + 0.1, DT + 0.04), doorFrameMat);
      leftFrame.position.set(-(DW / 2 + 0.035), DH / 2, 0);
      this.doorFrameGroup.add(leftFrame);

      // الإطار الأيمن
      const rightFrame = new THREE.Mesh(new THREE.BoxGeometry(0.07, DH + 0.1, DT + 0.04), doorFrameMat);
      rightFrame.position.set(DW / 2 + 0.035, DH / 2, 0);
      this.doorFrameGroup.add(rightFrame);

      this.scene.add(this.doorFrameGroup);

      // ===== جدارين جانبيين يملآن باقي فتحة الخلية على يمين ويسار الباب =====
      // عرض الخلية = this.cellSize ≈ 3.4 ، عرض الباب = DW = 1.1
      // الفراغ على كل جانب = (cellSize - DW) / 2 ≈ 1.15
      const sideW = (this.cellSize - DW) / 2;
      const sideMat = this.wallMat;

      // جدار يسار الباب
      const sideLeft = new THREE.Mesh(
        new THREE.BoxGeometry(sideW, this.wallHeight, DT + 0.02),
        sideMat
      );
      sideLeft.position.set(x - DW / 2 - sideW / 2, this.wallHeight / 2, z);
      this.scene.add(sideLeft);
      this.colliders.push({
        min: { x: x - DW / 2 - sideW - 0.05, z: z - DT / 2 - 0.05 },
        max: { x: x - DW / 2 + 0.05,          z: z + DT / 2 + 0.05 }
      });

      // جدار يمين الباب
      const sideRight = new THREE.Mesh(
        new THREE.BoxGeometry(sideW, this.wallHeight, DT + 0.02),
        sideMat
      );
      sideRight.position.set(x + DW / 2 + sideW / 2, this.wallHeight / 2, z);
      this.scene.add(sideRight);
      this.colliders.push({
        min: { x: x + DW / 2 - 0.05,          z: z - DT / 2 - 0.05 },
        max: { x: x + DW / 2 + sideW + 0.05,  z: z + DT / 2 + 0.05 }
      });

      // الجزء العلوي فوق الباب (حتى السقف)
      const topFill = new THREE.Mesh(
        new THREE.BoxGeometry(DW, this.wallHeight - DH, DT + 0.02),
        sideMat
      );
      topFill.position.set(x, DH + (this.wallHeight - DH) / 2, z);
      this.scene.add(topFill);
      this.colliders.push({
        min: { x: x - DW / 2 - 0.05, z: z - DT / 2 - 0.05 },
        max: { x: x + DW / 2 + 0.05, z: z + DT / 2 + 0.05 }
      });

      // ===== مجموعة الباب المتحركة (تدور عند الفتح) =====
      // محور الدوران عند الحافة اليسرى من الباب
      this.doorGroup = new THREE.Group();
      this.doorGroup.position.set(x - DW / 2, 0, z);

      // لوح الباب الرئيسي
      const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(DW, DH, DT), doorPanelMat);
      doorPanel.position.set(DW / 2, DH / 2, 0);
      this.doorGroup.add(doorPanel);

      // زخرفة: لوح علوي داخل الباب
      const panelTop = new THREE.Mesh(new THREE.BoxGeometry(DW * 0.72, DH * 0.38, DT * 0.5), doorFrameMat);
      panelTop.position.set(DW / 2, DH * 0.7, DT * 0.26);
      this.doorGroup.add(panelTop);

      // زخرفة: لوح سفلي داخل الباب
      const panelBot = new THREE.Mesh(new THREE.BoxGeometry(DW * 0.72, DH * 0.32, DT * 0.5), doorFrameMat);
      panelBot.position.set(DW / 2, DH * 0.28, DT * 0.26);
      this.doorGroup.add(panelBot);

      // مقبض الباب (كرة ذهبية + عصا)
      const knobSphere = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), handleMat);
      knobSphere.position.set(DW - 0.14, DH / 2, DT * 0.7);
      this.doorGroup.add(knobSphere);

      const knobStick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.18, 8), handleMat);
      knobStick.rotation.z = Math.PI / 2;
      knobStick.position.set(DW - 0.14, DH / 2, DT * 0.25);
      this.doorGroup.add(knobStick);

      this.scene.add(this.doorGroup);

      // ضوء فوق الباب يجعله مرئياً من بعيد
      const doorLight = new THREE.PointLight('#ffaa44', 1.4, 10);
      doorLight.position.set(x, DH + 0.6, z + 0.5);
      this.scene.add(doorLight);

      // ===== الـ Collider: فقط منطقة الباب الفعلية الصغيرة =====
      this.doorCollider = {
        min: { x: x - DW / 2 - 0.05, z: z - DT / 2 - 0.05 },
        max: { x: x + DW / 2 + 0.05, z: z + DT / 2 + 0.05 }
      };
      this.colliders.push(this.doorCollider);
      this.doorOpened = false;
      this._doorWidth = DW;
    }

    openDoor() {
      if (this.doorOpened) return;
      this.doorOpened = true;
      // إزالة الـ collider فور الفتح حتى يمر اللاعب والعدو
      this.colliders = this.colliders.filter(c => c !== this.doorCollider);
      let rot = 0;
      const target = Math.PI / 2;
      const animate = () => {
        rot += 0.045;
        this.doorGroup.rotation.y = Math.min(rot, target);
        if (rot < target) requestAnimationFrame(animate);
      };
      animate();
    }

    // إرجاع موضع عشوائي reachable بعيد عن موضع مرجعي — يستخدم NavGraph
    getRandomFreeCell(avoidPos, minDist = 12) {
      const cs = this.cellSize;
      const avoidR = Math.round(avoidPos.z / cs);
      const avoidC = Math.round(avoidPos.x / cs);
      const minCellDist = Math.ceil(minDist / cs);
      const cell = NavGraph.randomReachableCell(avoidR, avoidC, minCellDist);
      return new THREE.Vector3(cell.c * cs, 0, cell.r * cs);
    }
  }

  // ============================================================
  //  PLAYER SYSTEM  (داخل HTML)

  class PlayerSystem {
    constructor(camera, map, onToggleSettings = null) {
      this.camera = camera;
      this.map = map;
      this.toggleSettings = onToggleSettings;
      this.radius = 0.45;
      this.speed = 7.0;
      this.bob = 0;
      this.hasWeapon = true;
      this.lastShotTime = 0;
      this.recoil = 0;
      this.keys = {};
      this.mouseDelta = { x: 0, y: 0 };
      this.joy = { x: 0, y: 0 };
      this.yaw = Math.PI;
      this.pitch = 0;
      // vectors مؤقتة مخزنة — لا نخلق objects جديدة كل frame
      this._fwd = new THREE.Vector3();
      this._rgt = new THREE.Vector3();
      this._dir = new THREE.Vector3();
      this.firePressed = false;
      this.interactPressed = false;
      this._buildBody();
      this._bindInputs();
    }

    _buildBody() {
      this.legsGroup = new THREE.Group();
      const pantsMat = new THREE.MeshStandardMaterial({ color: '#1a252f', roughness: 1 });
      const bootMat  = new THREE.MeshStandardMaterial({ color: '#111',    roughness: 0.9 });
      this.leftLeg = new THREE.Group();
      const llMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.8, 8), pantsMat); llMesh.position.y = 0.4;
      const llBoot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.15, 0.28), bootMat); llBoot.position.set(0, 0.075, 0.05);
      this.leftLeg.add(llMesh, llBoot);
      this.leftLeg.position.set(-0.16, 0, 0);

      this.rightLeg = new THREE.Group();
      const rlMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.8, 8), pantsMat); rlMesh.position.y = 0.4;
      const rlBoot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.15, 0.28), bootMat); rlBoot.position.set(0, 0.075, 0.05);
      this.rightLeg.add(rlMesh, rlBoot);
      this.rightLeg.position.set(0.16, 0, 0);

      this.legsGroup.add(this.leftLeg, this.rightLeg);

    _bindInputs() {
      window.addEventListener('keydown', e => {
        this.keys[e.code] = true;
        if (e.code === 'Escape') this.toggleSettings?.();
      });
      window.addEventListener('keyup', e => this.keys[e.code] = false);

      document.body.addEventListener('mousemove', e => {
        if (document.pointerLockElement && !GameSettings.paused) {
          this.mouseDelta.x -= e.movementX * GameSettings.sensitivity;
          this.mouseDelta.y -= e.movementY * GameSettings.sensitivity;
        }
      });

      const app = document.getElementById('app');
      app.addEventListener('mousedown', e => {
        if (GameSettings.paused) return;
        if (!document.pointerLockElement && window.innerWidth > 768) { document.body.requestPointerLock(); }
        else if (e.button === 0) { this.firePressed = true; }
      });
      app.addEventListener('mouseup', () => this.firePressed = false);

      const joy = document.getElementById('joystick');
      const knob = joy.querySelector('.knob');
      let jId = null, jCenter = { x: 0, y: 0 };
      joy.addEventListener('pointerdown', e => {
        if (GameSettings.paused) return;
        jId = e.pointerId;
        const rect = joy.getBoundingClientRect();
        jCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        joy.setPointerCapture(jId);
      });
      window.addEventListener('pointermove', e => {
        if (e.pointerId !== jId) return;
        let dx = e.clientX - jCenter.x, dy = e.clientY - jCenter.y;
        const dist = Math.min(Math.hypot(dx, dy), 35);
        const angle = Math.atan2(dy, dx);
        knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        this.joy.x = (Math.cos(angle) * dist) / 35;
        this.joy.y = (Math.sin(angle) * dist) / 35;
      });
      const stopJ = (e) => { if (e.pointerId === jId) { jId = null; this.joy = { x: 0, y: 0 }; knob.style.transform = 'translate(0,0)'; } };
      window.addEventListener('pointerup', stopJ);
      window.addEventListener('pointercancel', stopJ);

      // --- نظام النظر باللمس (متوافق مع APK / PWA / WebView) ---
      let lookId = null, lastT = { x: 0, y: 0 };

      const isLookTarget = (e) => {
        if (GameSettings.paused) return false;
        if (e.target.closest('.action-btn')) return false;
        if (e.target.closest('#top-controls')) return false;
        if (e.target.closest('#joystick')) return false;
        // الجانب الأيمن من الشاشة (35% أو أكثر) — يعمل بغض النظر عن عرض الشاشة
        return e.clientX >= window.innerWidth * 0.35;
      };

      document.body.addEventListener('pointerdown', e => {
        if (!isLookTarget(e) || lookId !== null) return;
        lookId = e.pointerId;
        lastT  = { x: e.clientX, y: e.clientY };
        try { document.body.setPointerCapture(lookId); } catch(_) {}
      });

      window.addEventListener('pointermove', e => {
        if (e.pointerId !== lookId) return;
        const dx = (e.clientX - lastT.x) * 0.0045;
        const dy = (e.clientY - lastT.y) * 0.0045;
        lastT = { x: e.clientX, y: e.clientY };
        this.mouseDelta.x -= dx;
        this.mouseDelta.y -= dy;
      });

      const stopLook = e => { if (e.pointerId === lookId) lookId = null; };
      window.addEventListener('pointerup',     stopLook);
      window.addEventListener('pointercancel', stopLook);

      document.getElementById('btn-fire').addEventListener('pointerdown',    e => { e.preventDefault(); if (!GameSettings.paused) this.firePressed = true; });
      document.getElementById('btn-fire').addEventListener('pointerup',      e => { e.preventDefault(); this.firePressed = false; });
      document.getElementById('btn-interact').addEventListener('pointerdown', e => { e.preventDefault(); if (!GameSettings.paused) this.interactPressed = true; });
      document.getElementById('btn-interact').addEventListener('pointerup',   e => { e.preventDefault(); this.interactPressed = false; });
    }

    checkCollision(x, z) {
      const r = this.radius;
      // حدود الخريطة الخارجية
      const cols = mapLayout[0].length;
      const rows = mapLayout.length;
      const maxX = (cols - 1) * this.map.cellSize + this.map.cellSize / 2;
      const maxZ = (rows - 1) * this.map.cellSize + this.map.cellSize / 2;
      const minX = -this.map.cellSize / 2;
      const minZ = -this.map.cellSize / 2;
      if (x - r < minX || x + r > maxX || z - r < minZ || z + r > maxZ) return true;
      for (const c of this.map.colliders) {
        if (x + r > c.min.x && x - r < c.max.x && z + r > c.min.z && z - r < c.max.z) return true;
      }
      return false;
    }

    update(delta, time) {
      this.yaw   += this.mouseDelta.x;
      this.pitch += this.mouseDelta.y;
      this.mouseDelta.x = 0; this.mouseDelta.y = 0;
      this.pitch = clamp(this.pitch, -Math.PI / 2 + 0.1, Math.PI / 2 - 0.1);
      this.camera.rotation.y = this.yaw;
      this.camera.rotation.x = this.pitch;

      let mX = 0, mY = 0;
      if (this.keys['KeyW']) mY += 1;
      if (this.keys['KeyS']) mY -= 1;
      if (this.keys['KeyA']) mX -= 1;
      if (this.keys['KeyD']) mX += 1;
      mX += this.joy.x;
      mY -= this.joy.y;   // joy.y موجب للأسفل، لذا نطرحه صحيح
      const len = Math.hypot(mX, mY);
      if (len > 1) { mX /= len; mY /= len; }

      // في Three.js الكاميرا تنظر نحو -Z عند yaw=0
      // fwd يجب أن يشير إلى الاتجاه الذي تنظر إليه الكاميرا
      const fwd = this._fwd.set(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
      const rgt = this._rgt.set(-fwd.z,              0,  fwd.x);
      const dir = this._dir.set(0, 0, 0);
      dir.addScaledVector(rgt, mX).addScaledVector(fwd, mY);

      if (dir.lengthSq() > 0.01) {
        const nX = this.camera.position.x + dir.x * this.speed * delta;
        const nZ = this.camera.position.z + dir.z * this.speed * delta;
        if (!this.checkCollision(nX, this.camera.position.z)) this.camera.position.x = nX;
        if (!this.checkCollision(this.camera.position.x, nZ)) this.camera.position.z = nZ;
        this.bob += delta * this.speed * 2.0;
      }

      this.camera.position.y = 1.62 + Math.sin(this.bob) * 0.05;
      this.legsGroup.position.set(this.camera.position.x, 0, this.camera.position.z);
      this.legsGroup.rotation.y = this.yaw;

      if (dir.lengthSq() > 0.01) {
        this.leftLeg.position.y  = Math.abs(Math.sin(this.bob)) * 0.1;
        this.leftLeg.position.z  = Math.sin(this.bob) * 0.25;
        this.rightLeg.position.y = Math.abs(Math.sin(this.bob + Math.PI)) * 0.1;
        this.rightLeg.position.z = Math.sin(this.bob + Math.PI) * 0.25;
      } else {
        this.leftLeg.position.y  = lerp(this.leftLeg.position.y,  0, delta * 10);
        this.leftLeg.position.z  = lerp(this.leftLeg.position.z,  0, delta * 10);
        this.rightLeg.position.y = lerp(this.rightLeg.position.y, 0, delta * 10);
        this.rightLeg.position.z = lerp(this.rightLeg.position.z, 0, delta * 10);
      }

      if (this.hasWeapon && (this.firePressed || this.keys['KeyF']) && time - this.lastShotTime > 110) {
        this.lastShotTime = time;
        this.recoil = 0.15;
        this.flashLight.intensity = 2;
        AudioSys.playShoot();
      }

      this.recoil = lerp(this.recoil, 0, delta * 15);
      this.equipAK.position.z = -0.4 + this.recoil * 0.15;
      this.equipAK.rotation.x = this.recoil * 0.4;
      this.flashLight.intensity = lerp(this.flashLight.intensity, 0, delta * 25);
    }
  }

    show(onCorrect, onWrong) {
      GameState.questionActive = true;

      // اختيار سؤال عشوائي

        btn.textContent = ch;

        // للموبايل - stopPropagation لمنع تفعيل click أيضاً

      clearInterval(this._timerInterval);
      let elapsed = 0;
      this._timerInterval = setInterval(() => {
        elapsed += 0.25;
        const remaining = Math.max(0, 5 - elapsed);
        const pct = (remaining / 5) * 100;
        document.getElementById('q-timer-bar').style.width = pct + '%';
        document.getElementById('q-timer-num').textContent = Math.ceil(remaining);
        if (remaining <= 0) {
          clearInterval(this._timerInterval);
          this._fail();

      }, 250);

      if (!GameState.questionActive) return;
      clearInterval(this._timerInterval);

      GameState.questionActive = false;

  // ============================================================
  //  ENEMY SYSTEM  (مُحدَّث بالكامل)
  //  - ذكاء اصطناعي حقيقي: مطاردة مستمرة
  //  - سرعة العدو أسرع بـ 0.1 من اللاعب
  //  - عند الإصابة: اللاعب أسرع بـ 0.2 لمدة 5 ثوانٍ
  //  - نظام القبض والأسئلة والقلوب
  //  - Respawn سريع جداً ويبدأ بالمطاردة فوراً
  //  - منع إطلاق النار من خلف الجدران (Raycast check)
  // ============================================================
  class EnemySystem {
    constructor(scene, maze, camera) {
      this.scene  = scene;
      this.maze   = maze;
      this.camera = camera;

      // --- ثوابت العدو ---
      this.MAX_HP          = 100;
      this.DAMAGE_PER_SHOT = 10;
      this.BASE_PLAYER_SPEED = 7.0;   // سرعة اللاعب الأساسية
      this.ENEMY_RADIUS    = 0.45;
      this.ATTACK_RANGE    = 1.6;     // مسافة القبض
      this.SWAP_INTERVAL   = 0.2;
      this.RESPAWN_DELAY   = 1.0;     // Respawn سريع جداً
      this.ENEMY_SCALE     = 2;

      // سرعة العدو = سرعة اللاعب + 0.1
      this._baseEnemySpeed  = this.BASE_PLAYER_SPEED + 0.1;
      this._currentEnemySpeed = this._baseEnemySpeed;

      // مؤقت boost اللاعب عند الإصابة
      this._playerBoostTimer = 0;
      this._playerBoosted    = false;

      // مؤقتات
      this._swapTimer    = 0;
      this._respawnTimer = 0;
      this._isDead       = false;
      this._hp           = this.MAX_HP;
      this._hitFlash     = 0;
      this._activeModel  = 1;

      // حالة القبض
      this._isCatching   = false;

      // مجموعة العدو الرئيسية
      this.group = new THREE.Group();
      this.scene.add(this.group);

      this._lastHitTime = 0;

      // راي كاستر لفحص الجدران (لا يستخدم mesh - يستخدم colliders)

      this._buildHealthBar();
      this._buildGrid();

      this._weam1 = null;
      this._weam2 = null;
      this._loadModels();

      const spawnCell = this._findInitialSpawn();
      this.group.position.copy(spawnCell);
    }

    // يجد موضع spawn العدو — يعتمد على NavGraph للتحقق من reachability
    _findInitialSpawn() {
      const cs = this.maze.cellSize;
      // ابحث عن 'A' في الخريطة أولاً
      for (let r = 0; r < mapLayout.length; r++) {
        for (let c = 0; c < mapLayout[r].length; c++) {
          if (mapLayout[r][c] === 'A') {
            // تحقق أن A قابلة للوصول
            if (NavGraph.isReachable(r, c)) {
              console.log(`[Enemy] Initial spawn at 'A' (${r},${c}) ✅`);
              return new THREE.Vector3(c * cs, 0, r * cs);
            } else {
              console.warn(`[Enemy] 'A' at (${r},${c}) NOT reachable — using NavGraph fallback`);
            }
          }
        }
      }
      // Fallback: خلية reachable في منتصف الخريطة بعيدة عن S
      const spawnR = Math.round(this.maze.spawn.z / cs);
      const spawnC = Math.round(this.maze.spawn.x / cs);
      const cell = NavGraph.randomReachableCell(spawnR, spawnC, 12);
      console.log(`[Enemy] Fallback spawn at (${cell.r},${cell.c})`);
      return new THREE.Vector3(cell.c * cs, 0, cell.r * cs);
    }

    _loadModels() {
      const loader = new THREE.GLTFLoader();
      const loadOne = (path, onDone) => {
        loader.load(path, gltf => {
          const model = gltf.scene;
          model.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material = child.material.clone();
              child.material.side = THREE.DoubleSide;
              if (child.material.map) {
                child.material.emissive = new THREE.Color(0x888888);
                child.material.emissiveMap = child.material.map;
                child.material.emissiveIntensity = 0.85;
              } else if (child.material.color) {
                child.material.emissive = child.material.color.clone().multiplyScalar(0.7);
                child.material.emissiveIntensity = 1.0;
              }
              child.userData.origEmissive = child.material.emissive.clone();
              child.userData.origEmissiveIntensity = child.material.emissiveIntensity;
              child.material.needsUpdate = true;
            }
          });
          const box  = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const h    = size.y || 1;
          const s    = (1.8 / h) * this.ENEMY_SCALE;
          model.scale.setScalar(s);
          const center = box.getCenter(new THREE.Vector3());
          model.position.set(-center.x * s, -box.min.y * s, -center.z * s);
          model.visible = false;
          this.group.add(model);
          onDone(model);
        }, undefined, () => {
          const fallback = this._buildFallback();
          fallback.visible = false;
          this.group.add(fallback);
          onDone(fallback);
        });
      };
      loadOne('models/WEAM1.glb', m => { this._weam1 = m; this._weam1.visible = true; this._checkBothLoaded(); });
      loadOne('models/WEAM2.glb', m => { this._weam2 = m; this._checkBothLoaded(); });
    }

    _checkBothLoaded() { if (this._weam1 && this._weam2) this._activeModel = 1; }

    _buildFallback() {
      const g    = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: '#c98b62', roughness: 0.6 });
      const dark = new THREE.MeshStandardMaterial({ color: '#333',    roughness: 0.8 });
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.45), skin); head.position.y = 1.7;
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.8,  0.3), dark); body.position.y = 1.05;
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.25), dark); legL.position.set(-0.15, 0.38, 0);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.25), dark); legR.position.set( 0.15, 0.38, 0);
      g.add(head, body, legL, legR);
      return g;
    }

    _buildHealthBar() {
      this._hpCanvas  = document.createElement('canvas');
      this._hpCanvas.width  = 128;
      this._hpCanvas.height = 20;
      this._hpTexture = new THREE.CanvasTexture(this._hpCanvas);
      const mat = new THREE.SpriteMaterial({ map: this._hpTexture, depthTest: false });
      this._hpSprite = new THREE.Sprite(mat);
      this._hpSprite.scale.set(1.4, 0.22, 1);
      this._hpSprite.position.y = 2.35;
      this.group.add(this._hpSprite);
      this._drawHpBar(this._hp);
    }

    _drawHpBar(hp) {
      const ctx = this._hpCanvas.getContext('2d');
      const w = this._hpCanvas.width, h = this._hpCanvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      if (ctx.roundRect) { ctx.roundRect(0, 0, w, h, 4); ctx.fill(); }
      else ctx.fillRect(0, 0, w, h);
      const ratio = clamp(hp / this.MAX_HP, 0, 1);
      const r = Math.round(255 * (1 - ratio));
      const g = Math.round(220 * ratio);
      ctx.fillStyle = `rgb(${r},${g},30)`;
      const pad = 3;
      ctx.fillRect(pad, pad, (w - pad * 2) * ratio, h - pad * 2);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`HP ${hp}`, w / 2, h / 2);
      this._hpTexture.needsUpdate = true;
    }

    _enemyCollides(x, z) {
      const r = this.ENEMY_RADIUS;
      for (const c of this.maze.colliders) {
        if (x + r > c.min.x && x - r < c.max.x && z + r > c.min.z && z - r < c.max.z) return true;
      }
      return false;
    }

    _die() {
      this._isDead = true;
      this._hp = 0;
      this._drawHpBar(0);
      this.group.visible = false;
      this._respawnTimer = 0;
      this._isCatching = false;
      EnemyAudio.stop();
    }

    _respawn() {
      // ابحث عن خلية reachable بعيدة عن اللاعب — مضمونة بواسطة NavGraph
      const spawnPos = this.maze.getRandomFreeCell(this.camera.position, 18);
      if (spawnPos) {
        this.group.position.copy(spawnPos);
        // تحقق أن الموضع الجديد reachable
        const cs = this.maze.cellSize;
        const r = Math.round(spawnPos.z / cs);
        const c = Math.round(spawnPos.x / cs);
        if (!NavGraph.isReachable(r, c)) {
          console.warn('[Enemy] Respawn landed in non-reachable cell! Forcing to spawn point.');
          this.group.position.copy(this._findInitialSpawn());
        }
      }
      this._hp     = this.MAX_HP;
      this._isDead = false;
      this._isCatching = false;
      this.group.visible = true;
      this._drawHpBar(this._hp);
      this._currentEnemySpeed = this._baseEnemySpeed;
      // إعادة تعيين مؤقت المسار لإعادة الحساب فوراً
      this._pathTimer = 999;
      this._currentPath = null;
      this._pathStep = 1;
    }

    // ---- فحص هل هناك جدار بين اللاعب والعدو (باستخدام colliders) ----
    _hasWallBetween(playerPos) {
      const ex = this.group.position.x;
      const ez = this.group.position.z;
      const px = playerPos.x;
      const pz = playerPos.z;
      const steps = 20;
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const cx = px + (ex - px) * t;
        const cz = pz + (ez - pz) * t;
        const r = 0.15;
        for (const c of this.maze.colliders) {
          if (cx + r > c.min.x && cx - r < c.max.x && cz + r > c.min.z && cz - r < c.max.z) {
            return true; // يوجد جدار في المسار
          }
        }
      }
      return false;
    }

    hit() {
      if (this._isDead) return;
      const now = performance.now();
      if (now - this._lastHitTime < 120) return;
      this._lastHitTime = now;

      // فحص الجدار: لا تُسجل إصابة لو يوجد جدار بينهما
      if (this._hasWallBetween(this.camera.position)) return;

      this._hp = Math.max(0, this._hp - this.DAMAGE_PER_SHOT);
      this._drawHpBar(this._hp);
      this._hitFlash = 1.0;

      // boost اللاعب: يصبح أسرع بـ 0.2 لمدة 5 ثوانٍ
      this._playerBoostTimer  = 5.0;
      this._playerBoosted     = true;
      this._currentEnemySpeed = this.BASE_PLAYER_SPEED - 0.2; // العدو أبطأ من اللاعب المقوّى

      if (this._hp <= 0) this._die();
    }

    // ---- القبض على اللاعب ----
    _catchPlayer(playerRef) {
      if (this._isCatching || GameState.questionActive || GameState.captureActive) return;
      this._isCatching = true;
      GameState.captureActive = true;
      GameSettings.paused = true;
      document.exitPointerLock?.();

      // إظهار سؤال
      QuestionSystem.show(
        // إجابة صحيحة: ضربة بالحذاء ثم موت العدو
        () => {
          KickAnimation.play(() => {
            GameState.captureActive = false;
            this._isCatching = false;
            GameSettings.paused = false;
            this._die(); // العدو يموت ويعمل Respawn بدون إنقاص القلوب
          });
        },
        // إجابة خاطئة أو انتهاء الوقت: ينقص قلب
        () => {
          GameState.hearts = Math.max(0, GameState.hearts - 1);
          renderHearts();
          if (GameState.hearts <= 0) GameState.gameOver = true;
          // هدية الخريطة إذا وصل للقلب الأخير
          if (GameState.hearts <= 1 && !GameState.hasMap) {
            GameState.hasMap = true;
            showMapGift();
          }
          GameState.captureActive = false;
          this._isCatching = false;
          // حفظ موضع اللاعب الحالي للرجوع إليه إذا لم يكن game over
          const savedPos = {
            x: this.camera.position.x,
            y: this.camera.position.y,
            z: this.camera.position.z
          };
          const savedKeys = GameState.keysCollected;

          // إظهار شاشة الهزيمة
          DefeatOverlay.show(() => {
            GameSettings.paused = false;
            if (GameState.hearts <= 0) {
              // ===== إعادة كاملة من البداية: مفاتيح + خريطة تتصفر =====
              GameState.gameOver = false; // إعادة تعيين gameOver عند البدء من جديد
              GameState.hearts = GameState.maxHearts;
              GameState.keysCollected = 0;
              GameState.hasMap = false;
              GameState.mapRevealed = false;
              // تصفير أي مفاتيح عالقة
              player.keys = {};
              player.joy  = { x: 0, y: 0 };
              player.firePressed = false;
              player.interactPressed = false;
              renderHearts();
              // إعادة المفاتيح للظهور
              for (const k of this.maze.keyObjects) {
                k.userData.collected = false;
                k.visible = true;
              }
              // إعادة خريطة الآيتم
              if (this.maze.mapItemObj) {
                this.maze.mapItemObj.userData.collected = false;
                this.maze.mapItemObj.visible = true;
              }
              // إخفاء زر الخريطة
              document.getElementById('map-btn').style.display = 'none';
              document.getElementById('map-btn').style.color = '#aaa';
              document.getElementById('keys-hud').textContent = '🗝️ 0/3';
              // إرجاع اللاعب لنقطة البداية
              this.camera.position.copy(this.maze.spawn);
              this.camera.position.y = 1.62;
            } else {
              // ===== خسارة قلب واحد: ابدأ من نفس النقطة مع المفاتيح =====
              GameState.keysCollected = savedKeys;
              document.getElementById('keys-hud').textContent = `🗝️ ${GameState.keysCollected}/3`;
              this.camera.position.set(savedPos.x, savedPos.y, savedPos.z);
            }
            // إعادة ظهور العدو بعيداً
            this._die();
          });
        }
      );
    }

    _applyHitFlash(model, flash) {
      // تأثير الاحمرار محذوف — الوجه يبقى كما هو عند الإطلاق
    }

    // ============================================================
    // BFS Pathfinding — يجد أقرب مسار عبر الجدران
    // ============================================================
    // يعتمد على NavGraph كمصدر موحد — لا تكرار في البيانات
    _buildGrid() {
      this._gridRows = NavGraph.rows;
      this._gridCols = NavGraph.cols;
      // نستخدم NavGraph.walkable مباشرة (نفس المصدر للـ collision والـ pathfinding)
      this._grid = [];
      for (let r = 0; r < this._gridRows; r++) {
        this._grid[r] = [];
        for (let c = 0; c < this._gridCols; c++) {
          this._grid[r][c] = NavGraph.isWalkable(r, c);
        }
      }
      console.log(`[NavGraph→AI] Grid ${this._gridRows}×${this._gridCols} loaded from NavGraph ✅`);
    }

    _worldToGrid(wx, wz) {
      const cs = this.maze.cellSize;
      return {
        gx: Math.round(wx / cs),
        gz: Math.round(wz / cs)
      };
    }

    _bfs(startGx, startGz, goalGx, goalGz) {
      const rows = this._gridRows;
      const cols = this._gridCols;
      if (!this._grid) return null;
      const visited = new Uint8Array(rows * cols);
      // استخدم Map بدلاً من Int32Array لتجنب مشكلة fill(-1)
      const parent  = {};
      const queue   = [];
      const idx = (gx, gz) => gz * cols + gx;

      const clampGx = gx => Math.max(0, Math.min(cols - 1, gx));
      const clampGz = gz => Math.max(0, Math.min(rows - 1, gz));
      startGx = clampGx(startGx); startGz = clampGz(startGz);
      goalGx  = clampGx(goalGx);  goalGz  = clampGz(goalGz);

      if (!this._grid[startGz][startGx]) return null;
      const startIdx = idx(startGx, startGz);
      visited[startIdx] = 1;
      parent[startIdx] = -1; // نقطة البداية
      queue.push([startGx, startGz]);
      let head = 0;

      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      while (head < queue.length) {
        const [cx, cz] = queue[head++];
        const curIdx = idx(cx, cz);
        if (cx === goalGx && cz === goalGz) {
          // تتبع المسار
          let path = [];
          let cur = curIdx;
          while (cur !== -1) {
            const pgz = Math.floor(cur / cols);
            const pgx = cur % cols;
            path.unshift({ gx: pgx, gz: pgz });
            cur = parent[cur];
          }
          return path;
        }
        for (const [dx, dz] of dirs) {
          const nx = cx + dx, nz = cz + dz;
          if (nx < 0 || nx >= cols || nz < 0 || nz >= rows) continue;
          if (!this._grid[nz][nx]) continue;
          const ni = idx(nx, nz);
          if (visited[ni]) continue;
          visited[ni] = 1;
          parent[ni] = curIdx;
          queue.push([nx, nz]);
        }
      }
      return null; // لا مسار
    }

    update(delta, playerPos, playerRef) {
      // --- boost اللاعب countdown ---
      if (this._playerBoosted) {
        this._playerBoostTimer -= delta;
        if (this._playerBoostTimer <= 0) {
          this._playerBoosted    = false;
          this._playerBoostTimer = 0;
          this._currentEnemySpeed = this._baseEnemySpeed;
        }
      }

      if (this._isDead) {
        this._respawnTimer += delta;
        if (this._respawnTimer >= this.RESPAWN_DELAY) this._respawn();
        return;
      }

      if (this._isCatching || GameState.questionActive || GameState.captureActive) return;

      // --- تبديل المجسمين ---
      if (this._weam1 && this._weam2) {
        this._swapTimer += delta;
        if (this._swapTimer >= this.SWAP_INTERVAL) {
          this._swapTimer = 0;
          this._activeModel = this._activeModel === 1 ? 2 : 1;
          this._weam1.visible = (this._activeModel === 1);
          this._weam2.visible = (this._activeModel === 2);
        }
      }

      if (this._hitFlash > 0) {
        this._hitFlash = Math.max(0, this._hitFlash - delta * 8);
        const activeModel = this._activeModel === 1 ? this._weam1 : this._weam2;
        this._applyHitFlash(activeModel, this._hitFlash);
      }

      // --- BFS Pathfinding: تحديث كل 0.5 ثانية (كان 0.35) — يوفر CPU على APK ---
      this._pathTimer = (this._pathTimer || 0) + delta;
      const _bfsInterval = (_isWebView) ? 0.55 : 0.38;
      if (this._pathTimer >= _bfsInterval || !this._currentPath) {
        this._pathTimer = 0;
        const eg = this._worldToGrid(this.group.position.x, this.group.position.z);
        const pg = this._worldToGrid(playerPos.x, playerPos.z);
        this._currentPath = this._bfs(eg.gx, eg.gz, pg.gx, pg.gz);
        this._pathStep = 1; // تخطى الخلية الأولى (الحالية)
      }

      const ex = this.group.position.x;
      const ez = this.group.position.z;
      const dist = Math.hypot(playerPos.x - ex, playerPos.z - ez);

      if (dist <= this.ATTACK_RANGE) {
        this._catchPlayer(playerRef);
        return;
      }

      // --- تحرك نحو الخطوة التالية في المسار ---
      let targetX = playerPos.x;
      let targetZ = playerPos.z;

      if (this._currentPath && this._pathStep < this._currentPath.length) {
        const step = this._currentPath[this._pathStep];
        const stepWX = step.gx * this.maze.cellSize;
        const stepWZ = step.gz * this.maze.cellSize;
        const distToStep = Math.hypot(stepWX - ex, stepWZ - ez);
        if (distToStep < this.maze.cellSize * 0.6) this._pathStep++;
        targetX = stepWX;
        targetZ = stepWZ;
      }

      const dx = targetX - ex;
      const dz = targetZ - ez;
      const dLen = Math.hypot(dx, dz);
      if (dLen > 0.01) {
        const nx = dx / dLen;
        const nz = dz / dLen;
        const spd = this._currentEnemySpeed;
        const newX = ex + nx * spd * delta;
        const newZ = ez + nz * spd * delta;
        if (!this._enemyCollides(newX, ez)) this.group.position.x = newX;
        if (!this._enemyCollides(this.group.position.x, newZ)) this.group.position.z = newZ;
        this.group.rotation.y = Math.atan2(playerPos.x - this.group.position.x, playerPos.z - this.group.position.z);
      }

      if (AudioSys.ctx) {
        EnemyAudio.init(AudioSys.ctx);
        EnemyAudio.updateVolume(dist, 30);
      }
    }
  }

  // ============================================================
  //  MAP OVERLAY SYSTEM  — مُعاد بناؤه بالكامل من NavGraph
  //  ✅ يستخدم نفس NavGraph المصدر كـ collision + AI + spawn
  //  ✅ لا mismatch بين العالم الحقيقي والخريطة المعروضة
  // ============================================================
  const MapOverlay = {
    _el: null,
    _canvas: null,
    init(maze, enemy, camera) {
      this._maze = maze;
      this._enemy = enemy;
      this._camera = camera;

      const div = document.createElement('div');
      div.id = 'map-overlay';
      div.style.cssText = `
        position:fixed;inset:0;z-index:8000;display:none;
        background:rgba(0,0,0,0.88);align-items:center;justify-content:center;
        flex-direction:column;
      `;
      const canvas = document.createElement('canvas');
      canvas.width = 520; canvas.height = 520;
      canvas.style.cssText = `border:2px solid #ffd700;border-radius:12px;max-width:92vw;max-height:80vh;`;
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕ إغلاق [M]';
      closeBtn.style.cssText = `margin-top:14px;padding:10px 28px;background:#ffd700;color:#000;font-weight:900;border:none;border-radius:8px;font-size:15px;cursor:pointer;`;
      closeBtn.addEventListener('click', () => this.hide());
      div.appendChild(canvas);
      div.appendChild(closeBtn);
      document.getElementById('app').appendChild(div);
      this._el = div;
      this._canvas = canvas;
    },
    show() {
      if (!GameState.hasMap) return;
      GameSettings.paused = true;
      document.exitPointerLock?.();
      this._draw();
      this._el.style.display = 'flex';
    },
    hide() {
      this._el.style.display = 'none';
      if (!GameState.questionActive && !GameState.captureActive) {
        GameSettings.paused = false;
      }
    },
    _draw() {
      const ctx = this._canvas.getContext('2d');
      // ✅ الأبعاد من NavGraph — نفس مصدر العالم
      const rows = NavGraph.rows;
      const cols = NavGraph.cols;
      const cw = this._canvas.width;
      const ch = this._canvas.height;
      const cellW = cw / cols;
      const cellH = ch / rows;
      ctx.clearRect(0, 0, cw, ch);
      ctx.fillStyle = '#0d1b0d';
      ctx.fillRect(0, 0, cw, ch);

      // ✅ رسم الخلايا مباشرة من NavGraph.walkable — صحيح 100%
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const px = c * cellW;
          const pz = r * cellH;
          if (NavGraph.isWalkable(r, c)) {
            // تمييز الخلايا reachable عن غيرها (للتشخيص — كلها reachable الآن)
            ctx.fillStyle = NavGraph.isReachable(r, c) ? '#1a2e1a' : '#2a1010';
            ctx.fillRect(px, pz, cellW, cellH);
          } else {
            ctx.fillStyle = '#4a5a3a';
            ctx.fillRect(px + 1, pz + 1, cellW - 2, cellH - 2);
          }
        }
      }

      const cs = this._maze.cellSize;

      // رسم المفاتيح
      for (const k of this._maze.keyObjects) {
        if (k.userData.collected) continue;
        const gc = k.position.x / cs;
        const gr = k.position.z / cs;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(gc * cellW + cellW / 2, gr * cellH + cellH / 2, Math.max(cellW * 0.35, 4), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = `bold ${Math.max(cellH * 0.6, 8)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('K', gc * cellW + cellW / 2, gr * cellH + cellH / 2);
      }

      // رسم الخريطة (آيتم) إذا لم تُجمع
      if (this._maze.mapItemObj && !this._maze.mapItemObj.userData.collected) {
        const mp = this._maze.mapItemObj.position;
        const gc = mp.x / cs; const gr = mp.z / cs;
        ctx.fillStyle = '#00ccff';
        ctx.fillRect(gc * cellW + 1, gr * cellH + 1, cellW - 2, cellH - 2);
        ctx.fillStyle = '#000';
        ctx.font = `bold ${Math.max(cellH * 0.55, 7)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('M', gc * cellW + cellW / 2, gr * cellH + cellH / 2);
      }

      // رسم الباب
      const dgc = this._maze.doorPos.x / cs;
      const dgr = this._maze.doorPos.z / cs;
      ctx.fillStyle = '#ff6600';
      ctx.fillRect(dgc * cellW + 1, dgr * cellH + 1, cellW - 2, cellH - 2);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(cellH * 0.55, 7)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('D', dgc * cellW + cellW / 2, dgr * cellH + cellH / 2);

      // رسم العدو
      const egc = this._enemy.group.position.x / cs;
      const egr = this._enemy.group.position.z / cs;
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.arc(egc * cellW + cellW / 2, egr * cellH + cellH / 2, Math.max(cellW * 0.4, 5), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(cellH * 0.6, 8)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('👹', egc * cellW + cellW / 2, egr * cellH + cellH / 2);

      // رسم اللاعب
      const pgc = this._camera.position.x / cs;
      const pgr = this._camera.position.z / cs;
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(pgc * cellW + cellW / 2, pgr * cellH + cellH / 2, Math.max(cellW * 0.45, 6), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = `bold ${Math.max(cellH * 0.65, 9)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', pgc * cellW + cellW / 2, pgr * cellH + cellH / 2);

      // مفتاح الخريطة
      ctx.font = '11px sans-serif'; ctx.fillStyle = '#aaa'; ctx.textAlign = 'left';
      const legend = [
        ['★', '#00ff88', ' أنت'],
        ['👹', '#ff0000', ' العدو'],
        ['K', '#ffd700', ' مفتاح'],
        ['D', '#ff6600', ' الباب'],
      ];
      legend.forEach(([sym, col, label], i) => {
        ctx.fillStyle = col;
        ctx.fillText(sym + label, 6, 16 + i * 18);
      });
    }
  };
