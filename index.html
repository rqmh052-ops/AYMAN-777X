  // ============================================================
  //  SHOOTING RAY-CAST  (تفحص هل الطلقة أصابت العدو)
  // ============================================================
  const _raycaster = new THREE.Raycaster();
  let _lastShotCheck = 0;

  function checkShotHit(time) {
    if (time - _lastShotCheck < 115) return;
    // نتحقق فقط لو اللاعب أطلق للتو
    const justFired = player.hasWeapon &&
      (player.firePressed || player.keys['KeyF']) &&
      time - player.lastShotTime < 130;
    if (!justFired) return;
    _lastShotCheck = time;

    // Ray من مركز الشاشة
    _raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    const hits = _raycaster.intersectObject(enemy.group, true);
    if (hits.length > 0 && hits[0].distance < 25) {
      enemy.hit();
    }
  }

  // ============================================================
  //  MAIN LOOP  — Frame-pacing fix for WebView/APK
  // ============================================================
  let lastTime = performance.now();
  let frames = 0, lastFps = lastTime;
  let _fpsSmooth = 60;

  const _deltaHistory = [0.016, 0.016, 0.016, 0.016, 0.016, 0.016];
  let _deltaIndex = 0;
  let _skipHeavy = false;
  let _heavyCounter = 0;

  function loop(time) {
    requestAnimationFrame(loop);

    const rawDelta = (time - lastTime) / 1000;
    lastTime = time;

    if (rawDelta > 0.18) {
      frames++;
      if (time - lastFps >= 1000) { fpsPill.innerText = 'FPS: ' + frames; frames = 0; lastFps = time; }
      return;
    }

    _deltaHistory[_deltaIndex] = rawDelta;
    _deltaIndex = (_deltaIndex + 1) % 6;
    const delta = Math.min(
      (_deltaHistory[0]+_deltaHistory[1]+_deltaHistory[2]+_deltaHistory[3]+_deltaHistory[4]+_deltaHistory[5]) / 6,
      0.05
    );

    frames++;
    if (time - lastFps >= 1000) {
      _fpsSmooth = frames;
      fpsPill.innerText = 'FPS: ' + frames;
      frames = 0;
      lastFps = time;
      _skipHeavy = (_fpsSmooth < 28);
    }

    _heavyCounter++;
    const doHeavy = !_skipHeavy || (_heavyCounter % 2 === 0);

    if (!GameSettings.paused) {
      player.update(delta, time);
      enemy.update(delta, camera.position, player);
      if (doHeavy) checkShotHit(time);

      // --- جمع المفاتيح ---
      for (const keyObj of maze.keyObjects) {
        if (keyObj.userData.collected) continue;
        const d = Math.hypot(camera.position.x - keyObj.position.x, camera.position.z - keyObj.position.z);
        if (d < 1.8) {
          keyObj.userData.collected = true;
          keyObj.visible = false;
          GameState.keysCollected++;
          document.getElementById('keys-hud').textContent = `🗝️ ${GameState.keysCollected}/3`;
          instPanel.innerHTML = GameState.keysCollected < 3
            ? `جمعت مفتاح! (${GameState.keysCollected}/3)<br>ابحث عن بقية المفاتيح!`
            : `جمعت كل المفاتيح!<br>اذهب للباب الآن!`;
          if (GameState.hearts <= 1 && !GameState.hasMap) {
            GameState.hasMap = true;
            showMapGift();
          }
        }
        if (doHeavy) {
          keyObj.rotation.y += delta * 2;
          keyObj.position.y = Math.sin(time * 0.002) * 0.1 + 0.3;
        }
      }

      // --- جمع الخريطة (آيتم على الأرض) ---
      if (maze.mapItemObj && !maze.mapItemObj.userData.collected) {
        const mp = maze.mapItemObj.position;
        const md = Math.hypot(camera.position.x - mp.x, camera.position.z - mp.z);
        if (md < 1.8) {
          maze.mapItemObj.userData.collected = true;
          maze.mapItemObj.visible = false;
          GameState.hasMap = true;
          document.getElementById('map-btn').style.display = 'block';
          document.getElementById('map-btn').style.color = '#ffd700';
          instPanel.innerHTML = 'وجدت خريطة!<br>اضغط [M] لفتحها!';
        }
        if (maze.mapItemObj.visible && doHeavy) {
          maze.mapItemObj.rotation.y += delta;
          maze.mapItemObj.position.y = Math.sin(time * 0.0015) * 0.08 + 0.05;
        }
      }

      if (GameState.hasMap) {
        document.getElementById('map-btn').style.display = 'block';
      }
    }

    // --- تفاعل الباب ---
    const distToDoor = camera.position.distanceTo(maze.doorPos);
    if (distToDoor < 3.0 && !maze.doorOpened) {
      if (GameState.keysCollected >= GameState.totalKeys) {
        promptUI.textContent = '🚪 اضغط [E] لفتح الباب';
        promptUI.style.display = 'block';
        btnInteractMob.style.display = 'flex';
        btnInteractMob.textContent = '🚪';
      } else {
        const need = GameState.totalKeys - GameState.keysCollected;
        promptUI.textContent = `🗝️ تحتاج ${need} مفتاح إضافي`;
        promptUI.style.display = 'block';
        btnInteractMob.style.display = 'none';
      }
      if ((player.interactPressed || player.keys['KeyE']) && GameState.keysCollected >= GameState.totalKeys) {
        maze.openDoor();
        npcGroup.visible = true;
        instPanel.innerHTML = "لقد وجدت المخرج!<br>اذهب وتحدث مع الناجي.";
        player.interactPressed = false;
        player.keys['KeyE'] = false;
      }
    } else {
      promptUI.style.display = 'none';
      if (!maze.doorOpened) btnInteractMob.style.display = 'none';
    }

    if (maze.doorOpened && camera.position.z < maze.doorPos.z - 2) {
      instPanel.innerHTML = "السلام عليكم! لقد تمكنت من الخروج بسلام.";
    }

    renderer.render(scene, camera);
  }

  loop(performance.now());
  </script>
</body>
</html>
